name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # weekly: advisories appear without any code changing

permissions:
  contents: read

# The jobs run one after another, cheapest first, so a problem is reported in seconds
# rather than minutes and nothing else is started after a failure.
jobs:
  deps:
    name: Dependency advisories, licences, sources # ~40s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  build:
    name: Lint, test, build # ~3 min
    needs: deps
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the version comes from rust-toolchain.toml
        with:
          toolchain: 1.97.0
          components: clippy
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: The free build has no Store licensing code
        shell: pwsh
        run: |
          # Nab Pro (closed, separate) adds the Windows Store API to its own build. The public
          # build must never contain it: the free tool makes no calls of that kind.
          $features = cargo tree --locked -e features -i windows | Out-String
          if ($features -match 'Services_Store') { throw "Services_Store is enabled in the public build" }
      - name: Test (unit + real Windows OCR, clipboard, registry)
        run: cargo test --locked -- --test-threads=1 --nocapture
      - name: Build release
        run: cargo build --locked --release
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match Cargo.toml version $v" }
      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\nab.exe dist\
          # Browsers and antivirus web filters block a bare, unsigned .exe on reputation alone, before
          # anything has looked inside it. The same file inside a zip usually downloads cleanly, so both
          # are published and both are hashed.
          Compress-Archive -Path dist\nab.exe -DestinationPath dist\nab.zip -Force
          foreach ($f in 'nab.exe', 'nab.zip') {
            $hash = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Out-File dist\SHA256SUMS.txt -Encoding ascii -Append
          }
          Get-Content dist\SHA256SUMS.txt
      - name: Build the MSIX (unsigned; the Microsoft Store signs it)
        shell: pwsh
        env:
          STORE_NAME: ${{ vars.STORE_NAME }}
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY: ${{ vars.STORE_PUBLISHER_DISPLAY }}
        run: |
          $args = @{ Out = "dist\Nab.msix" }
          if ($env:STORE_NAME) { $args.StoreName = $env:STORE_NAME }
          if ($env:STORE_IDENTITY_NAME) { $args.IdentityName = $env:STORE_IDENTITY_NAME }
          if ($env:STORE_PUBLISHER) { $args.Publisher = $env:STORE_PUBLISHER }
          if ($env:STORE_PUBLISHER_DISPLAY) { $args.PublisherDisplay = $env:STORE_PUBLISHER_DISPLAY }
          .\msix\build.ps1 @args
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nab-${{ github.sha }}
          path: dist/

  codeql:
    name: CodeQL (Rust) # ~4.5 min
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          category: codeql-rust

  release:
    name: Publish the GitHub release
    needs: [build, codeql] # everything has to be green before anything is published
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance attestation
      attestations: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }} # optional: a free VirusTotal key; see SECURITY.md
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nab-${{ github.sha }}
          path: dist
      - name: Scan the exe with VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/nab.exe
      - name: "Attest where this exe came from (verify with: gh attestation verify nab.exe --owner puente-digital-uk)"
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/nab.exe
      - name: Keep the signature bundle next to the exe too
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/nab.exe.sigstore.json
      - name: Write the release notes
        env:
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          sum=$(grep ' nab.exe$' dist/SHA256SUMS.txt | cut -d' ' -f1)
          vt=""
          if [ -n "$VT_ANALYSIS" ]; then
            url=$(printf '%s' "$VT_ANALYSIS" | tr ',' '\n' | grep '^dist/nab.exe=' | cut -d= -f2-)
            [ -n "$url" ] && vt="VirusTotal scan of this exact file: $url"
          fi
          cat > notes.md <<EOF
          **Download \`nab.exe\` and run it.** No installer, nothing else to install. It sits in the tray: hold **Ctrl+Shift** and click on any text to copy it, or drag a box.

          Windows SmartScreen may say it "prevented an unrecognised app from starting" because this build isn't code-signed yet. Click **More info → Run anyway**. The Microsoft Store version is signed by Microsoft and shows no warning.

          If your browser or antivirus blocks the download itself, take \`nab.zip\` instead \u2014 the same exe, zipped. A new unsigned exe has no download reputation yet, and some web filters treat that alone as suspicious. Nothing in this build connects to the internet; check it against the scan and the hash below, or build it yourself from this tag.

          SHA-256 of \`nab.exe\`: \`$sum\` — check it with \`Get-FileHash nab.exe\` in PowerShell. $vt

          Built from this tag by GitHub Actions ([the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})), so the binary matches the public source. Provenance is attested: \`gh attestation verify nab.exe --owner puente-digital-uk\` proves it came from this workflow and commit.
          EOF
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Nab ${{ github.ref_name }}${{ startsWith(github.ref_name, 'v0.') && ' (beta)' || '' }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }} # every 0.x release is a beta
          files: |
            dist/nab.exe
            dist/nab.zip
            dist/SHA256SUMS.txt
            dist/nab.exe.sigstore.json
          body_path: notes.md
          generate_release_notes: true
