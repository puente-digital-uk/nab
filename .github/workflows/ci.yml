name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master # the version comes from rust-toolchain.toml
        with:
          toolchain: 1.97.0
          components: clippy
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (unit + real Windows OCR, clipboard, registry)
        run: cargo test --locked -- --test-threads=1 --nocapture
      - name: Build release
        run: cargo build --locked --release
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $v" }
      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\nab.exe dist\
          $hash = (Get-FileHash dist\nab.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  nab.exe" | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - name: Build the MSIX (unsigned; the Microsoft Store signs it)
        shell: pwsh
        run: |
          $args = @{ Out = "dist\Nab.msix" }
          if ("${{ vars.STORE_IDENTITY_NAME }}") { $args.IdentityName = "${{ vars.STORE_IDENTITY_NAME }}" }
          if ("${{ vars.STORE_PUBLISHER }}") { $args.Publisher = "${{ vars.STORE_PUBLISHER }}" }
          if ("${{ vars.STORE_PUBLISHER_DISPLAY }}") { $args.PublisherDisplay = "${{ vars.STORE_PUBLISHER_DISPLAY }}" }
          .\msix\build.ps1 @args
      - uses: actions/upload-artifact@v4
        with:
          name: nab-${{ github.sha }}
          path: dist/

  release:
    name: Publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # build provenance attestation
      attestations: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }} # optional: a free VirusTotal key; see SECURITY.md
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nab-${{ github.sha }}
          path: dist
      - name: Scan the exe with VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/nab.exe
      - name: "Attest where this exe came from (verify with: gh attestation verify nab.exe --owner puente-digital-uk)"
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/nab.exe
      - name: Write the release notes
        env:
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          sum=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          vt=""
          if [ -n "$VT_ANALYSIS" ]; then
            url=$(printf '%s' "$VT_ANALYSIS" | tr ',' '\n' | grep '^dist/nab.exe=' | cut -d= -f2-)
            [ -n "$url" ] && vt="VirusTotal scan of this exact file: $url"
          fi
          cat > notes.md <<EOF
          **Download \`nab.exe\` and run it.** No installer, nothing else to install. It sits in the tray: hold **Ctrl+Shift** and click on any text to copy it, or drag a box.

          Windows SmartScreen may say it "prevented an unrecognised app from starting" because this build isn't code-signed yet. Click **More info → Run anyway**. The Microsoft Store version is signed by Microsoft and shows no warning.

          SHA-256 of \`nab.exe\`: \`$sum\` — check it with \`Get-FileHash nab.exe\` in PowerShell. $vt

          Built from this tag by GitHub Actions ([the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})), so the binary matches the public source. Provenance is attested: \`gh attestation verify nab.exe --owner puente-digital-uk\` proves it came from this workflow and commit.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Nab ${{ github.ref_name }}${{ startsWith(github.ref_name, 'v0.') && ' (beta)' || '' }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }} # every 0.x release is a beta
          files: |
            dist/nab.exe
            dist/SHA256SUMS.txt
          body_path: notes.md
          generate_release_notes: true
