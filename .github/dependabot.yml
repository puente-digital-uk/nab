version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # Steps that must move together arrive in one pull request. The CodeQL steps refuse to run on mixed versions.
      codeql-action:
        patterns: ["github/codeql-action*"]
      artifact-actions:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
